<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Listing</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:Arial,sans-serif; background:#f5f5f5; padding-bottom:60px; }
        .header { background:#2d3748; color:white; padding:15px 20px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
        .header a { color:white; text-decoration:none; }
        .header h1 { font-size:18px; }
        .container { max-width:600px; margin:0 auto; padding:15px; }
        .form-card { background:white; border-radius:10px; padding:20px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom:15px; }
        .form-group label { display:block; font-weight:bold; color:#2d3748; margin-bottom:5px; font-size:14px; }
        .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:5px; font-size:16px; }
        .form-group textarea { min-height:80px; resize:vertical; }
        .submit-btn { width:100%; padding:15px; background:#48bb78; color:white; border:none; border-radius:5px; font-size:18px; font-weight:bold; cursor:pointer; }
        .submit-btn:hover { background:#38a169; }
        .dairy-fields { background:#ebf8ff; padding:15px; border-radius:8px; margin-top:10px; display:none; }
        .dairy-fields.show { display:block; }
        .flash { background:#fed7d7; color:#c53030; padding:12px; border-radius:8px; margin-bottom:15px; }
        .required { color:#e53e3e; }
        .photo-section { background:#f7fafc; padding:15px; border-radius:8px; margin-bottom:15px; }
        .photo-section h4 { color:#2d3748; margin-bottom:10px; font-size:16px; }
        .photo-section .form-group { margin-bottom:10px; }
        .photo-section .form-group:last-child { margin-bottom:0; }
        .home-btn { background:#48bb78; color:white; padding:8px 16px; border-radius:8px; text-decoration:none; font-weight:bold; font-size:14px; }
        .home-btn:hover { background:#38a169; }
        .back-link { color:white; text-decoration:none; font-size:20px; margin-right:10px; }
        .header-left { display:flex; align-items:center; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <a href="/admin/dashboard" class="back-link">←</a>
            <h1>Add New Listing</h1>
        </div>
        <a href="/" class="home-btn">🏠 Home</a>
    </div>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="flash">{{ messages[0] }}</div>{% endif %}
        {% endwith %}
        <div class="form-card">
            <form method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Title <span class="required">*</span></label>
                    <input type="text" name="title" placeholder="e.g., Boran Cow" required>
                </div>
                <div class="form-group">
                    <label>Category <span class="required">*</span></label>
                    <select name="category" id="category" required onchange="toggleDairyFields()">
                        <option value="cow">🐄 Cow</option>
                        <option value="ox">🐂 Ox</option>
                        <option value="goat">🐐 Goat</option>
                        <option value="sheep">🐑 Sheep</option>
                        <option value="dairy">🥛 Dairy Product</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Breed</label>
                    <input type="text" name="breed" placeholder="e.g., Boran, Harar">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Age (years)</label>
                    <input type="number" name="age" step="0.5" placeholder="e.g., 4">
                </div>
                <div class="form-group">
                    <label>Weight (kg)</label>
                    <input type="number" name="weight" step="0.1" placeholder="e.g., 420">
                </div>
                <div class="form-group">
                    <label>Height (cm) - Optional</label>
                    <input type="number" name="height" step="0.1" placeholder="e.g., 145">
                </div>
                <div class="form-group">
                    <label>Price (ETB) <span class="required">*</span></label>
                    <input type="number" name="price" step="0.01" placeholder="e.g., 150000" required>
                </div>
                <div class="form-group">
                    <label>Location <span class="required">*</span></label>
                    <select name="location" required>
                        <option value="">Select City</option>
                        <option value="Addis Ababa">Addis Ababa</option>
                        <option value="Dire Dawa">Dire Dawa</option>
                        <option value="Adama">Adama</option>
                        <option value="Hawassa">Hawassa</option>
                        <option value="Sululta">Sululta</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <!-- Photos -->
                <div class="photo-section">
                    <h4>📸 Photos (Up to 4)</h4>
                    <div class="form-group">
                        <label>Main Photo <span class="required">*</span></label>
                        <input type="file" name="photo" accept="image/*" required>
                        <small style="color:#718096;font-size:12px;">Front-facing view</small>
                    </div>
                    <div class="form-group">
                        <label>Side View</label>
                        <input type="file" name="photo_side" accept="image/*">
                        <small style="color:#718096;font-size:12px;">Side profile</small>
                    </div>
                    <div class="form-group">
                        <label>Front View</label>
                        <input type="file" name="photo_front" accept="image/*">
                        <small style="color:#718096;font-size:12px;">Close-up front</small>
                    </div>
                    <div class="form-group">
                        <label>Top View</label>
                        <input type="file" name="photo_top" accept="image/*">
                        <small style="color:#718096;font-size:12px;">Top-down view</small>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" placeholder="Describe your animal or product in detail..."></textarea>
                </div>
                <div class="form-group">
                    <label>Health Status</label>
                    <select name="health_status">
                        <option value="Healthy">Healthy</option>
                        <option value="Not Healthy">Not Healthy</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Vaccinated</label>
                    <select name="vaccinated">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Your Phone Number</label>
                    <input type="text" name="phone_number" placeholder="e.g., 0940293477" value="0940293477">
                </div>
                <div id="dairy-fields" class="dairy-fields">
                    <h3 style="color:#2b6cb0;margin-bottom:10px;">🥛 Dairy Cow Details</h3>
                    <div class="form-group">
                        <label>Milk Production (L/day)</label>
                        <input type="number" name="milk_production" step="0.1" placeholder="e.g., 12">
                    </div>
                    <div class="form-group">
                        <label>Feed Type</label>
                        <input type="text" name="feed_type" placeholder="e.g., Grass + Hay">
                    </div>
                    <div class="form-group">
                        <label>Feed Amount (kg/day)</label>
                        <input type="number" name="feed_amount" step="0.1" placeholder="e.g., 18">
                    </div>
                    <div class="form-group">
                        <label>Lactating</label>
                        <select name="lactating">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Pregnant</label>
                        <select name="pregnant">
                            <option value="No">No</option>
                            <option value="Yes">Yes</option>
                            <option value="Unknown">Unknown</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="submit-btn">✅ Add Listing</button>
            </form>
        </div>
    </div>
    <script>
        function toggleDairyFields() {
            var category = document.getElementById('category').value;
            var dairyFields = document.getElementById('dairy-fields');
            dairyFields.classList.toggle('show', category === 'cow');
        }
        toggleDairyFields();
    </script>
</body>
</html>
